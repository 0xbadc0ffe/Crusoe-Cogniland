name: ppo_rnn_reward_params
entity: crusoe
project: crusoe_in_cogniland
method: grid
metric:
  name: eval/aggregate/success
  goal: maximize

command:
  - ${env}
  - python
  - ${program}
  - --env-config
  - configs/env/cogniland.yaml
  - --agent-config
  - configs/agent/ppo_rnn.yaml
  - --sweep

program: scripts/train.py

# 2D sweep of the two non-zero reward coefficients under the
# reach + Euclidean-PBRS scheme. The shaping integral over a successful
# trajectory telescopes to shaping_coef * euclid_spawn (typically
# 30-70 pixels on balanced maps), so the reach / shaping balance at the
# current defaults is ~10 / (0.05*50 ≈ 2.5).
#
# shaping_coef: 0.0 ablates shaping; 0.2 makes shaping dominate.
# reach_bonus:  1 / 10 / 100 span a 100× range of terminal salience.
#
# Grid: 3 x 3 = 9 runs, fixed seed, 5M frames each. Re-run the best
# configuration with the ppo_rnn_euclid_shaping seeds sweep afterwards.
# Launch:
#     ./scripts/launch_sweep.sh configs/sweeps/ppo_rnn_reward_params.yaml -n 9 -r 1
parameters:
  seed:                         {value: 42}
  trainer.num_train_frames:     {value: 10_000_000}
  reward.shaping_coef:          {values: [0.05, 0.2]}
