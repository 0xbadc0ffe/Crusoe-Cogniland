# DreamerV3 across (model size × map size).
#
# Models 12M / 25M / 50M / 100M × map sizes 32 / 64 / 96 / 128 × 2 seeds
#   = 32 runs.
# Each run is ~30 min (12M @ 32) to ~3-4h (100M @ 128) on a single GPU
# for 1.5M env-steps. The wandb tags (`size=<X>M`, `map=<N>`) are set
# inside the script so cross-run charts can group/filter by either axis.
#
# Submit:
#   ./scripts/launch_sweep.sh configs/sweeps/dreamer_size_x_map.yaml -n 8

program: scripts/dreamerv3_crafter_in_cogniland.py
method: grid
metric:
  name: success/rolling100
  goal: maximize

parameters:
  # Swept axes — these are exactly the CLI flag names so wandb passes
  # them through cleanly.
  size:
    values: ["12M", "25M", "50M", "100M"]
  map-size:
    values: [32, 64, 96, 128]
  seed:
    values: [0, 1]
  # Fixed training budget + infra
  total-env-steps:
    value: 1_500_000
  num-envs:
    value: 32
  train-ratio:
    value: 64
  view-size:
    value: 21
  wandb-project:
    value: crafter_in_cogniland
  wandb-mode:
    value: online

command:
  - ${env}
  - python
  - -u
  - ${program}
  - ${args}
