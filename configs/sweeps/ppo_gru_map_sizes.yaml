# PPO + GRU across map sizes.
#
# 2 map sizes × 1 seed = 2 runs. Each run is ~30-90 minutes on an
# RTX 4090-class GPU at 5M timesteps. The `map=<N>` wandb tag is
# populated inside the script from --env-size so the cross-run charts
# can group/filter by map size.
#
# Submit:
#   ./scripts/launch_sweep.sh configs/sweeps/ppo_gru_map_sizes.yaml

program: scripts/train_ppo_gru.py
method: grid
metric:
  name: success/rolling100
  goal: maximize

parameters:
  # Swept axis
  env-size:
    values: [32, 96]
  # Fixed training budget + infra
  seed:
    value: 0
  total-timesteps:
    value: 5_000_000
  num-envs:
    value: 32
  num-steps:
    value: 128
  view-size:
    value: 21
  tile-px:
    value: 8
  device:
    value: cuda
  wandb-project:
    value: crafter_in_cogniland
  wandb-mode:
    value: online
  map-type:
    value: random

command:
  - ${env}
  - python
  - -u
  - ${program}
  - ${args}
