# PPO + GRU across map sizes.
#
# 4 map sizes × 1 seed = 4 runs. Each run is ~30-90 minutes on an
# RTX 4090-class GPU at 5M timesteps. The `map=<N>` wandb tag is
# populated inside the script from --env-size so the cross-run charts
# can group/filter by map size.
#
# Run locally (sequential agent):
#   wandb sweep configs/sweeps/ppo_gru_map_sizes.yaml
#   wandb agent --count 4 <entity>/<project>/<sweep_id>

program: scripts/train_ppo_gru.py
project: crafter_in_cogniland
method: grid
metric:
  name: success/rolling100
  goal: maximize

parameters:
  # Swept axis
  env-size:
    values: [32, 64, 96, 128]
  # Fixed training budget + infra
  seed:
    value: 0
  total-timesteps:
    value: 5_000_000
  num-envs:
    value: 32
  num-steps:
    value: 128
  view-size:
    value: 21
  tile-px:
    value: 8
  device:
    value: cuda
  wandb-project:
    value: crafter_in_cogniland
  wandb-mode:
    value: online
  map-type:
    value: random

command:
  - ${env}
  - python
  - -u
  - ${program}
  - ${args}
