name: ppo_rnn_death_penalty_grid
entity: crusoe
project: crusoe_in_cogniland
method: grid
metric:
  name: eval/aggregate/avg_reward
  goal: maximize

command:
  - ${env}
  - python
  - ${program}
  - --env-config
  - configs/env/cogniland.yaml
  - --agent-config
  - configs/agent/ppo_rnn.yaml
  - --sweep

program: scripts/train.py

# Grid over the sparse death_penalty. All other reward knobs stay at their
# defaults (reach_bonus=10, step_penalty=0.01, shaping_coef=0.1).
#
# 6 runs.
parameters:
  reward.death_penalty: {values: [0.0, 2.5, 5.0, 7.5, 10.0, 15.0]}
  seed:                 {value: 42}

  trainer.num_train_frames: {value: 10_000_000}
