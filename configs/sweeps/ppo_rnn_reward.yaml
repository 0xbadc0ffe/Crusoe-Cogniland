name: ppo_rnn_reward_sweep
entity: crusoe
project: crusoe_in_cogniland
method: grid
metric:
  name: eval/aggregate/avg_success
  goal: maximize

command:
  - ${env}
  - python
  - ${program}
  - --env-config
  - configs/env/cogniland.yaml
  - --agent-config
  - configs/agent/ppo_rnn.yaml
  - --sweep

program: scripts/train.py

# Characterise reward + curriculum shaping on the navigation task.
#
# Pinned to num_tasks=1 so the ~1.4M-frames-per-task dilution of the 7-task
# production setup doesn't mask the reward signal. A follow-up multi-task
# sweep can re-open num_tasks around the winning reward point.
#
# Grid: 4 x 3 x 2 = 24 runs, 10M frames each.
# Launch with e.g.
#     ./scripts/launch_sweep.sh configs/sweeps/ppo_rnn_reward.yaml -n 24 -r 1
parameters:
  seed:                         {value: 42}
  num_tasks:                    {value: 1}
  trainer.num_train_frames:     {value: 50_000_000}
  trainer.full_eval_enabled:    {value: true}

  # New knob: flat bonus per movement-arrival on a berry tile (annealed).
  # 0.0 is the ablation control — verifies the bonus is doing work.
  curriculum.berry_step_bonus.initial_coef:
    values: [0.0, 0.5, 1.0, 2.0]