name: ppo_rnn_forage_berry_bonus_sweep
entity: crusoe
project: crusoe_in_cogniland
method: grid
metric:
  name: eval/aggregate/success
  goal: maximize

command:
  - ${env}
  - python
  - ${program}
  - --env-config
  - configs/env/cogniland.yaml
  - --agent-config
  - configs/agent/ppo_rnn.yaml
  - --sweep

program: scripts/train.py

# Characterise reward.forage_berry_bonus on the full multi-task / multi-biome
# setup. full_eval_enabled=true so each run gets per-task eval/* metrics that
# feed the sweep objective (eval/aggregate/success).
#
# Grid: 3 runs (one per forage_berry_bonus), 50M frames each.
# Launch with e.g.
#     ./scripts/launch_sweep.sh configs/sweeps/ppo_rnn_reward.yaml -n 3 -r 1
parameters:
  seed:                         {value: 42}
  tasks:                        {value: [0, 1, 2, 3, 4, 5, 6]}
  env.biome_filter:             {value: null}
  trainer.num_train_frames:     {value: 50_000_000}
  trainer.full_eval_enabled:    {value: true}

  # Markovian bonus when the agent forages on a berry tile. The knob we're
  # characterising: 0.0 is the ablation control; 3.0 / 6.0 scale up the
  # berry-detour incentive.
  reward.forage_berry_bonus:
    values: [0.0, 3.0, 6.0]
