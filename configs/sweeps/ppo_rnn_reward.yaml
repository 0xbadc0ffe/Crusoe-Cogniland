name: ppo_rnn_hp_coef_sweep
entity: crusoe
project: crusoe_in_cogniland
method: grid
metric:
  name: eval/aggregate/success
  goal: maximize

command:
  - ${env}
  - python
  - ${program}
  - --env-config
  - configs/env/cogniland.yaml
  - --agent-config
  - configs/agent/ppo_rnn.yaml
  - --sweep

program: scripts/train.py

# Characterise reward.hp_coef on the full multi-task / multi-biome setup.
# hp_coef scales the per-step Δhp shaping term: the agent earns +hp_coef
# per HP gained (berry forage) and -hp_coef per HP drained. Combined with
# the existing ctg PBRS term this is the full HP-aware reward. 0.0 is the
# no-HP-shaping ablation; 0.03 / 0.06 / 0.12 bracket the design note's
# default of 0.06.
#
# Grid: 4 runs (one per hp_coef), 50M frames each, full multi-task eval.
# Launch:
#     ./scripts/launch_sweep.sh configs/sweeps/ppo_rnn_reward.yaml -n 4 -r 1
parameters:
  seed:                         {value: 42}
  tasks:                        {value: [0, 1, 2, 3, 4, 5, 6]}
  env.biome_filter:             {value: null}
  trainer.num_train_frames:     {value: 50_000_000}
  trainer.full_eval_enabled:    {value: true}

  reward.hp_coef:
    values: [0.0, 0.03, 0.06, 0.12]
