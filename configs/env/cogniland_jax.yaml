experiment_name: cogniland_jax_default
results_path: results
offline: false

entity: crusoe
project: crusoe_in_cogniland

seed: 42

env_id: cogniland-jax           # switches to cogniland_jax.* env at make_env time
tasks: [0]
task_sampling: round_robin

env:
  num_parallel_envs: 128
  num_parallel_envs_eval: 16
  max_steps: 1000

  train_maps: data/maps/train.pt
  val_maps: data/maps/val.pt
  biome_filter: [balanced]

  difficulty: hard              # one of: easy / medium / hard
                                # easy=20, medium=50, hard=∞ max Euclidean spawn distance

reward:
  reach_bonus: 50.0
  step_penalty: 0.02
  shaping_coef: 0.3
  hp_coef: 0.12
  death_penalty: 0.0
  correct_answer_bonus: 50.0
  craft_bonus: 50.0

trainer:
  num_train_frames: 5_000_000
  num_eval_frames: 20_000
  eval_interval_frames: 500_000
  full_eval_enabled: true
  trajectory_viz_interval_frames: null
