# Island generation
size: 250
scale: 0.33
octaves: 6
persistence: 0.5
lacunarity: 2.0
seed: 42
filtering: "square"
sink_mode: 1

# Agent parameters
init_hp: 100.0
max_hp: 100.0
init_resources: 50.0
max_resources: 100.0

# Terrain effects — all resource costs scaled to 0.2× default (≈5× easier)
land_to_water_resource_cost: 4.0
land_resource_drain: 0.30
no_res_hp_multiplier: 2.0
forest_hp_gain: 8.0
forest_resource_gain: 5.0
sea_resource_costs: [0.14, 0.10, 0.06]
mountain_resource_costs: [0.4, 1.0]

# Minimap
minimap_max_ray: 22
minimap_occlude: true
minimap_clear_tolerance: 0.1

# Episode limits
max_steps: 1000

# Reward coefficients
lambda_p: 0.2
lambda_t: 60.0
lambda_d: 0.6
reward_reach_bonus: 100.0
time_penalty: 0.01

# Map pool (Level Replay)
map_pool_size: 16

# Custom map support (empty = procedurally generated)
map_name: ""
spawn_r: -1
spawn_c: -1
target_r: -1
target_c: -1

# Dataset and curriculum (optional)
dataset_path: "data/maps_seed42_train128_val16_test16.pt"
curriculum_switch_steps: 8_000_000
curriculum_easy_radius: 50
