experiment_name: default
results_path: results
offline: false

entity: crusoe
project: crusoe_in_cogniland

seed: 42

env_id: cogniland-v0
tasks: [0]                    # task ids included in training; sampler draws from this list
task_sampling: round_robin

env:
  num_parallel_envs: 128
  num_parallel_envs_eval: 8
  max_steps: 1000

  train_maps: data/maps/train.pt
  val_maps: data/maps/val.pt
  test_maps: data/maps/test.pt

  # Restrict to a subset of biomes (list) or null for all biomes.
  biome_filter: [balanced]

  occlude: true

  init_hp: 100
  hp_max: 100
  wood_max: 100
  craft_cost: 100

  terrain_vis_radius:
    ocean: 22
    deep_water: 20
    water: 16
    beach: 14
    sandy: 14
    grassland: 14
    forest: 12
    rocky: 18
    mountains: 22

  min_spawn_target_manhattan: 0

reward:
  # Φ(s, hp) = -ctg_direct(s) + (hp_coef / shaping_coef) * hp
  # r = -step_penalty
  #   + reach_bonus  * [reached]
  #   + shaping_coef * (ctg_prev - ctg_curr)     # PBRS on cost-to-go
  #   + hp_coef      * (hp_curr - hp_prev)       # PBRS on HP (berries/drain)
  #   - death_penalty * [died]                   # 0 by default, see CLAUDE.md
  reach_bonus: 150.0           # sparse bonus on reaching target
  step_penalty: 0.02           # per-step cost
  shaping_coef: 0.3            # target-pull PBRS coefficient
  hp_coef: 0.06                # HP-delta coefficient; mountain step -> -0.48, forage +10 HP -> +0.6
  death_penalty: 0.0           # CLAUDE.md: non-zero traps PPO in a "die fast" optimum
  correct_answer_bonus: 100.0  # tasks 1-3: biome-matching classification
  craft_bonus: 100.0           # tasks 4-6: craft required tool

trainer:
  num_train_frames: 10_000_000
  num_eval_frames: 50_000
  eval_interval_frames: 100_000
  full_eval_enabled: false
  trajectory_viz_interval_frames: 10_000