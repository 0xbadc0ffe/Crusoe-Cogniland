# ── Island generation ──
map_generation:
  size: 250
  scale: 0.33
  octaves: 6
  persistence: 0.5
  lacunarity: 2.0
  seed: 42
  filtering: "square"
  sink_mode: 1

# ── Agent parameters ──
agent:
  init_hp: 100.0
  max_hp: 100.0
  init_resources: 50.0
  max_resources: 100.0
  land_to_water_resource_cost: 20.0   # Boat construction cost
  no_res_hp_multiplier: 2.0           # HP lost per missing resource unit

# ── Minimap ──
minimap:
  max_ray: 22                  # CNN spatial dim = 2*max_ray+1 = 45
  occlude: true
  clear_tolerance: 0.1

# ── Episode limits ──
max_steps: 1000

# ── Custom map support (empty = procedurally generated) ──
custom_map:
  map_name: ""
  spawn_r: -1
  spawn_c: -1
  target_r: -1
  target_c: -1

# ── Terrain definitions (single source of truth) ──
# res_rate: signed resource rate per step — negative = drain, positive = gain (forest)
# hp_rate:  signed HP rate per step      — positive = heal (forest when below max HP)
# Tags drive engine logic: "water" triggers boat costs, "forest" triggers healing/gathering.
terrains:
  #                    threshold  move_cost  res_rate  hp_rate  visibility  color              tags
  - { name: ocean,      threshold: 0.007, move_cost: 1.0,  res_rate: -0.7, hp_rate: 0.0, visibility: 10, color: [5, 35, 225],      tags: [water] }
  - { name: deep_water, threshold: 0.025, move_cost: 1.25, res_rate: -0.5, hp_rate: 0.0, visibility:  8, color: [25, 65, 225],     tags: [water] }
  - { name: water,      threshold: 0.05,  move_cost: 1.5,  res_rate: -0.3, hp_rate: 0.0, visibility:  6, color: [65, 105, 225],    tags: [water] }
  - { name: beach,      threshold: 0.06,  move_cost: 1.75, res_rate: -1.5, hp_rate: 0.0, visibility:  5, color: [238, 214, 175],   tags: [land] }
  - { name: sandy,      threshold: 0.1,   move_cost: 2.0,  res_rate: -1.5, hp_rate: 0.0, visibility:  5, color: [210, 180, 140],   tags: [land] }
  - { name: grassland,  threshold: 0.25,  move_cost: 2.25, res_rate: -1.5, hp_rate: 0.0, visibility:  5, color: [34, 139, 34],     tags: [land] }
  - { name: forest,     threshold: 0.6,   move_cost: 3.0,  res_rate:  5.0, hp_rate: 8.0, visibility:  3, color: [0, 100, 0],       tags: [land, forest] }
  - { name: rocky,      threshold: 0.7,   move_cost: 3.5,  res_rate: -2.0, hp_rate: 0.0, visibility: 10, color: [139, 137, 137],   tags: [land] }
  - { name: mountains,  threshold: 1.0,   move_cost: 4.0,  res_rate: -5.0, hp_rate: 0.0, visibility: 22, color: [255, 250, 250],   tags: [land] }

# ── Reward shaping ──
reward:
  lambda_p: 0.1                  # Progress reward weight (Manhattan distance approach)
  lambda_t: 60.0                 # Time-efficiency bonus weight at success
  lambda_d: 0.6                  # Death penalty = lambda_d * reach_bonus
  reach_bonus: 100.0
