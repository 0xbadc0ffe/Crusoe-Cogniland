# Island generation
size: 250
scale: 0.33
octaves: 6
persistence: 0.5
lacunarity: 2.0
seed: 42
filtering: "square"
sink_mode: 1

# Agent parameters
init_hp: 100.0
max_hp: 100.0
init_resources: 50.0
max_resources: 100.0

# Terrain effects
land_to_water_resource_cost: 20.0     # Boat construction cost
land_resource_drain: 1.5              # Beach, sandy, grassland drain per step
no_res_hp_multiplier: 2.0             # HP lost per missing resource unit
forest_hp_gain: 8.0                   # Healing per step when below max HP
forest_resource_gain: 5.0             # Resources per step when at max HP
sea_resource_costs: [0.7, 0.5, 0.3]  # Ocean, deep_water, water
mountain_resource_costs: [2.0, 5.0]  # Rocky, mountains

# Minimap
minimap_max_ray: 22               # CNN spatial dim = 2*max_ray+1 = 45
minimap_occlude: true
minimap_clear_tolerance: 0.1

# Episode limits
max_steps: 1000

# Reward coefficients
lambda_p: 0.1                  # progress reward weight (Manhattan distance approach)
lambda_t: 60.0                 # time-efficiency bonus weight at success
lambda_d: 0.6                  # death penalty = lambda_d * reward_reach_bonus
reward_reach_bonus: 100.0

# Map pool (Level Replay) — number of procedural maps to pre-generate
map_pool_size: 16

# Custom map support (empty = procedurally generated)
map_name: ""
spawn_r: -1
spawn_c: -1
target_r: -1
target_c: -1

# Dataset and curriculum (optional)
dataset_path: "data/maps_seed42_train128_val16_test16.pt"  # path to .pt file from scripts/generate_dataset.py; "" = procedural
curriculum_switch_steps: 1_000_000     # 0 = disabled; switch EASY → NORMAL at this global_step
curriculum_easy_radius: 40     # radius (cells) around map center for EASY spawn/target
