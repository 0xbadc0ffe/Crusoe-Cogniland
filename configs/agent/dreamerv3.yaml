# DreamerV3 Configuration (200M model size)
# Based on the original DreamerV3 configs.yaml from Danijar Hafner
# Paper: https://arxiv.org/abs/2301.04104

agent:
  name: dreamerv3
  type: dreamerv3

  # Training
  batch_size: 16
  batch_length: 64
  train_ratio: 16
  pretrain: 100

  # Replay buffer
  replay:
    capacity: 1e6
    online: true

  # Model configuration
  model:
    # Loss scales
    loss_scales:
      rec: 1.0      # Reconstruction loss
      rew: 1.0      # Reward prediction loss
      con: 1.0      # Continuation (discount) prsdediction loss
      dyn: 1.0      # Dynamics loss (KL with stop_grad on posterior)
      rep: 0.1      # Representation loss (KL with stop_grad on prior)
      policy: 1.0   # Policy (actor) loss
      value: 1.0    # Value (critic) loss
      repval: 0.3   # Replay value loss

    # Single optimizer for all components (LaProp)
    opt:
      lr: 4e-5           # Learning rate
      agc: 0.3           # Adaptive gradient clipping
      eps: 1e-20         # Epsilon for numerical stability
      beta1: 0.9         # Adam momentum
      beta2: 0.999       # Adam RMS decay
      momentum: true     # Use momentum
      wd: 0.0            # Weight decay
      schedule: const    # Learning rate schedule
      warmup: 1000       # Warmup steps
      anneal: 0          # Annealing steps

    # RSSM configuration (200M model)
    dyn:
      typ: rssm
      rssm:
        hidden: 1024     # Hidden size for MLPs
        deter: 8192      # GRU hidden size (deterministic state)
        stoch: 32        # Number of categorical distributions
        classes: 64      # Classes per categorical (stochastic state size)
        blocks: 8        # Number of blocks for BlockLinear layer
        norm: rms        # Normalization type
        act: silu        # Activation function
        unimix: 0.01     # Uniform mixture for regularization
        outscale: 1.0    # Output scale
        imglayers: 2     # Layers for prior from deterministic state
        obslayers: 1     # Layers for posterior from observations
        dynlayers: 1     # Layers for dynamics
        free_nats: 1.0   # Free nats for KL divergence
        winit: trunc_normal_in  # Weight initialization

    # Encoder configuration
    enc:
      typ: simple
      simple:
        units: 1024      # MLP hidden size
        norm: rms        # Normalization type
        act: silu        # Activation function
        depth: 64        # CNN channel depth
        mults: [2, 3, 4, 4]  # Channel multipliers per layer
        layers: 3        # Number of MLP layers after CNN
        kernel: 5        # Convolution kernel size
        symlog: false     # Apply symlog to observations
        strided: false   # Use strided convolutions
        winit: trunc_normal_in  # Weight initialization

    # Decoder configuration
    dec:
      typ: simple
      simple:
        units: 1024      # MLP hidden size
        norm: rms        # Normalization type
        act: silu        # Activation function
        outscale: 1.0    # Output scale
        depth: 64        # CNN channel depth
        mults: [2, 3, 4, 4]  # Channel multipliers per layer
        layers: 3        # Number of MLP layers before CNN
        kernel: 5        # Convolution kernel size
        symlog: false     # Apply symlog to observations
        bspace: 8        # Bottleneck space
        strided: false   # Use strided convolutions
        winit: trunc_normal_in  # Weight initialization
        discrete_keys: [direction]  # One-hot categorical observations (use OneHotDist instead of MSE)

    # Reward predictor
    rewhead:
      layers: 1          # Number of MLP layers
      units: 1024        # MLP hidden size
      act: silu          # Activation function
      norm: rms          # Normalization type
      dist: symexp_twohot  # Output distribution type
      outscale: 0.0      # Output scale
      winit: trunc_normal_in  # Weight initialization
      bins: 255          # Number of bins for two-hot encoding

    # Continuation (discount) predictor
    conthead:
      layers: 1          # Number of MLP layers
      units: 1024        # MLP hidden size
      act: silu          # Activation function
      norm: rms          # Normalization type
      dist: binary       # Output distribution type
      outscale: 1.0      # Output scale
      winit: trunc_normal_in  # Weight initialization

    # Actor (policy) network
    actor:
      layers: 3          # Number of MLP layers
      units: 1024        # MLP hidden size
      act: silu          # Activation function
      norm: rms          # Normalization type
      dist: categorical  # Output distribution type
      minstd: 0.1        # Minimum std for continuous actions
      maxstd: 1.0        # Maximum std for continuous actions
      outscale: 0.01     # Output scale
      unimix: 0.01       # Uniform mixture for regularization
      winit: trunc_normal_in  # Weight initialization

    # Critic (value function)
    critic:
      layers: 3          # Number of MLP layers
      units: 1024        # MLP hidden size
      act: silu          # Activation function
      norm: rms          # Normalization type
      dist: symexp_twohot  # Output distribution type
      outscale: 0.0      # Output scale
      winit: trunc_normal_in  # Weight initialization
      bins: 255          # Number of bins for two-hot encoding

    # Imagination
    imag_last: 0         # Start imagination from last N steps (0 = all)
    imag_length: 15      # Horizon for imagination rollouts

    # Imagination loss (policy & value)
    imag_loss:
      horizon: 333         # Horizon for discount (gamma = 1 - 1/333 ≈ 0.997)
      lambda: 0.95         # GAE lambda
      entropy_coef: 3e-4   # Action entropy regularization
      slow_reg: 1.0        # Slow regularization weight
      slowtar: false       # Use slow target network
      contdisc: true       # Continue discount across episode boundaries
      update_normalizers: true

    # Replay loss (policy & value on real data)
    repl_loss:
      horizon: 333         # Horizon for discount (must match imag_loss)
      lambda: 0.95         # GAE lambda
      slow_reg: 1.0        # Slow regularization weight
      slowtar: false       # Use slow target network
      update_normalizers: true

    # Slow value network (target network)
    slowvalue:
      rate: 0.02         # EMA update rate
      every: 1           # Update every N steps

    # Return normalization
    retnorm:
      impl: perc         # Implementation: 'perc', 'std', or 'none'
      rate: 0.01         # EMA update rate
      limit: 1.0         # Limit for normalization
      perclo: 5.0        # Lower percentile
      perchi: 95.0       # Upper percentile
      debias: false      # Debias EMA

    # Value normalization
    valnorm:
      impl: none         # Implementation: 'perc', 'std', or 'none'
      rate: 0.01         # EMA update rate
      limit: 1e-8        # Limit for normalization

    # Advantage normalization
    advnorm:
      impl: none         # Implementation: 'perc', 'std', or 'none'
      rate: 0.01         # EMA update rate
      limit: 1e-8        # Limit for normalization

    # Miscellaneous
    reward_grad: true    # Backprop through reward predictor to world model
    repval_loss: true    # Use representation value loss
    repval_grad: true    # Backprop through representation value loss
    ac_grads: false      # Separate actor-critic gradients
    report: true         # Report metrics
    report_gradnorms: false  # Report gradient norms
    grad_checkpoint: true  # Use gradient checkpointing for scan operations (reduces VRAM, slower)

  # Visualization settings
  visualization:
    enabled: true          # Enable world model visualizations
    interval: 500        # Generate visualization every N training steps
    context: 5             # Number of context frames for teacher forcing
    log_prefix: dreamer_reconstruction  # WandB log prefix

  # Checkpoint settings
  checkpoint:
    enabled: true                    # Enable checkpoint saving
    save_only_best: true             # Only save best checkpoint (saves disk space)
    save_best: true                  # Save best checkpoint based on eval performance
    upload_to_wandb: false           # Upload best checkpoint to WandB (can be expensive for storage)
    checkpoint_dir: checkpoints      # Directory for checkpoints (relative to results/{run_id}/)

# Environment settings override (DreamerV3 works with pixel observations)
env:
  # Use RGB observations for DreamerV3
  navix_observation_type: rgb_first_person

metrics_tracker:
  # baselines_path is currently unused by `src/cogniland/metrics/tracker.py`.
  # baselines_path: configs/baselines/dreamerv3_minigrid.yaml
