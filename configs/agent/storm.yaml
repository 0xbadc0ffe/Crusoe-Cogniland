# STORM Configuration
# Based on the original STORM implementation with Transformer State-Space Model
# Paper: STORM uses Transformers (TSSM) instead of GRU (RSSM) for dynamics modeling
#
# KEY DIFFERENCES FROM DREAMERV3 (other than the TSSM vs RSSM):
# - 2 separate Adam optimizers (WM: lr=1e-4, AC: lr=3e-5) via optax.multi_transform
# - ReLU + LayerNorm for actor-critic (not SiLU + RMSNorm)
# - No replay value loss (repval)
# - gamma=0.985 (horizon=66), not gamma=0.997

agent:
  name: storm
  type: storm

  # Training
  batch_size: 16        # Number of trajectory segments sampled from replay
  batch_length: 64      # Length of each trajectory segment (matches TransformerMaxLength)
  train_ratio: 16
  pretrain: 100

  # Replay buffer
  replay:
    capacity: 1e6
    online: true

  # Model configuration
  model:
    # Loss scales (STORM uses different weights than DreamerV3)
    loss_scales:
      rec: 1.0      # Reconstruction loss
      rew: 1.0      # Reward prediction loss
      con: 1.0      # Continuation (discount) prediction loss
      dyn: 0.5      # Dynamics loss (STORM uses 0.5, not 1.0)
      rep: 0.1      # Representation loss (KL with stop_grad on prior)
      policy: 1.0   # Policy (actor) loss
      value: 1.0    # Value (critic) loss

    # Optimizer configuration
    # Original STORM uses 2 separate Adam optimizers with different learning rates
    # and gradient clipping. We implement this via optax.multi_transform.
    opt:
      # World model optimizer
      wm:
        lr: 1e-4           # World model learning rate
        eps: 1e-5          # Epsilon for numerical stability
        beta1: 0.9         # Adam momentum
        beta2: 0.999       # Adam RMS decay
        grad_clip: 1000.0  # Max norm gradient clipping for world model

      # Actor-critic optimizer
      ac:
        lr: 3e-5           # Actor-critic learning rate (lower than WM)
        eps: 1e-5          # Epsilon for numerical stability
        beta1: 0.9         # Adam momentum
        beta2: 0.999       # Adam RMS decay
        grad_clip: 100.0   # Max norm gradient clipping for actor-critic (stricter)

    # TSSM configuration (Transformer State-Space Model)
    dyn:
      typ: tssm
      tssm:
        stoch: 32              # Number of categorical distributions
        classes: 32            # Classes per categorical (stochastic state size)
        hidden_dim: 512        # Transformer hidden dimension
        num_layers: 2          # Number of transformer layers
        num_heads: 8           # Number of attention heads per layer
        mlp_ratio: 4.0         # MLP dimension ratio (hidden_dim * mlp_ratio)
        dropout_rate: 0.1      # Dropout rate (STORM uses 0.1, not 0.0)
        max_length: 1024       # Maximum sequence length for positional encoding (1024 per original)
        max_cache_length: 64   # Ring buffer size for KV-cache (prevents unbounded growth)
        unimix: 0.01           # Uniform mixture for regularization
        act: gelu              # Activation function (GeLU for transformer)
        norm: layer            # Normalization type (LayerNorm for transformers)
        free_nats: 1.0         # Free nats for KL divergence
        winit: trunc_normal_in  # Weight initialization
        binit: zeros           # Bias initialization

    # Encoder configuration (simple CNN with BatchNorm)
    enc:
      typ: simple
      simple:
        stem_channels: 32          # Initial number of channels
        final_feature_width: 4     # Target spatial resolution (4x4)

    # Decoder configuration (transposed CNN with BatchNorm)
    dec:
      typ: simple
      simple:
        stem_channels: 32          # Number of channels at penultimate layer
        final_feature_width: 4     # Spatial resolution at smallest layer
        out_channels: 3            # Output image channels (RGB)

    # Reward predictor (STORM uses ReLU + LayerNorm)
    rewhead:
      layers: 2          # Number of MLP layers
      units: 256         # MLP hidden size
      act: relu          # Activation function
      norm: layer        # Normalization type
      dist: symexp_twohot  # Output distribution type
      outscale: 0.0      # Output scale
      winit: trunc_normal_in  # Weight initialization
      bins: 255          # Number of bins for two-hot encoding

    # Continuation (discount) predictor (STORM uses ReLU + LayerNorm)
    conthead:
      layers: 2          # Number of MLP layers
      units: 256         # MLP hidden size
      act: relu          # Activation function
      norm: layer        # Normalization type
      dist: binary       # Output distribution type
      outscale: 1.0      # Output scale
      winit: trunc_normal_in  # Weight initialization

    # Actor (policy) network
    actor:
      layers: 3          # Number of MLP layers
      units: 512         # MLP hidden size
      act: relu          # Activation function
      norm: layer        # Normalization type
      dist: categorical  # Output distribution type
      minstd: 0.1        # Minimum std for continuous actions
      maxstd: 1.0        # Maximum std for continuous actions
      outscale: 0.01     # Output scale
      unimix: 0.01       # Uniform mixture for regularization
      winit: trunc_normal_in  # Weight initialization

    # Critic (value function)
    critic:
      layers: 3          # Number of MLP layers
      units: 512         # MLP hidden size
      act: relu          # Activation function
      norm: layer        # Normalization type
      dist: symexp_twohot  # Output distribution type
      outscale: 0.0      # Output scale
      winit: trunc_normal_in  # Weight initialization
      bins: 255          # Number of bins for two-hot encoding

    # Imagination
    imag_last: 0         # Use all timesteps from batch as starting points (0 = all)
                         # Total imagination batch size = batch_size * batch_length = 16 * 64 = 1024
    imag_length: 15      # Horizon for imagination rollouts
    imag_context: 8      # Number of past tokens for KV-cache warmup

    # Imagination loss (policy & value)
    # These configs are passed directly to imag_loss() via OmegaConf.to_container()
    imag_loss:
      horizon: 66          # Horizon for discount (gamma = 1 - 1/66 ≈ 0.985)
      lambda: 0.95         # GAE lambda
      entropy_coef: 3e-4   # Action entropy regularization
      slow_reg: 1.0        # Slow regularization weight
      slowtar: false       # Use slow target network
      contdisc: true       # Continue discount across episode boundaries
      update_normalizers: true

    # Temporal contrastive loss configuration
    temp_loss:
      scale: 0.0           # Scale for temporal contrastive loss -> set to ~0.1 to enable

    # Slow value network (target network)
    slowvalue:
      rate: 0.02         # EMA update rate (decay = 1 - rate = 0.98)
      every: 1           # Update every N steps

    # Return normalization
    retnorm:
      impl: perc         # Implementation: 'perc', 'std', or 'none'
      rate: 0.01         # EMA update rate
      limit: 1.0         # Limit for normalization
      perclo: 5.0        # Lower percentile
      perchi: 95.0       # Upper percentile
      debias: false      # Debias EMA

    # Value normalization
    valnorm:
      impl: none         # Implementation: 'perc', 'std', or 'none'
      rate: 0.01         # EMA update rate
      limit: 1e-8        # Limit for normalization

    # Advantage normalization
    advnorm:
      impl: none         # Implementation: 'perc', 'std', or 'none'
      rate: 0.01         # EMA update rate
      limit: 1e-8        # Limit for normalization

    # Miscellaneous
    reward_grad: true    # Backprop through reward predictor to world model
    repval_loss: false   # STORM does NOT use replay value loss
    repval_grad: false   # Disabled since repval_loss is false
    ac_grads: false      # Separate actor-critic gradients
    report: true         # Report metrics
    report_gradnorms: false  # Report gradient norms
    grad_checkpoint: true  # Use gradient checkpointing for scan operations (reduces VRAM, slower)

  # Visualization settings (now supported - uses unified video_predict)
  visualization:
    enabled: true         # Set to true to enable world model visualization in WandB
    interval: 500          # Generate visualization every N training steps
    context: 5             # Number of context frames for teacher forcing
    log_prefix: storm_reconstruction  # WandB log prefix

  # Checkpoint settings
  checkpoint:
    enabled: true                    # Enable checkpoint saving
    save_best: true                  # save to best/ when avg eval success improves
    save_last: true                  # refresh last/ on every validation
    upload_to_wandb: false           # Upload best checkpoint to WandB
    checkpoint_dir: checkpoints      # Directory for checkpoints

metrics_tracker:
  # baselines_path is currently unused by `src/cogniland/metrics/tracker.py`.
  # baselines_path: configs/baselines/storm_minigrid.yaml
