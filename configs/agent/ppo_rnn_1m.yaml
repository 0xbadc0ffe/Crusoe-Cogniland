agent:
  name: ppo_rnn
  type: ppo_rnn

  lr: 5e-4
  anneal_lr: true
  num_steps: 128
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  entropy_coef: 3e-2
  value_coef: 0.5
  clip_grad: 0.5
  normalize_advantages: true
  ppo_epochs: 4
  num_minibatches: 4

  # Widened trunk + LSTM to reach ~1M parameters. See init log for the
  # exact breakdown; CNN trunk is unchanged.
  hidden_size: 256              # post-concat Dense width (was 128)
  lstm_size: 256                # LSTM hidden width (was 128)
  embed_dim: 8
  num_tile_classes: 14
  head_num_layers: 1
  activation: relu

  use_rnn: true

  checkpoint:
    enabled: true
    save_best: false
    save_last: true
    upload_to_wandb: false
    checkpoint_dir: checkpoints
