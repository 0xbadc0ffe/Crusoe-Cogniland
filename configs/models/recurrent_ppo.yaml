name: recurrent_ppo

# ── Network architecture (~249K parameters) ──
scalar_dim: 5            # compass_x, compass_y, terrain_idx, resources, hp
minimap_channels: 3      # ch0 = heightmap, ch1 = target indicator, ch2 = visibility mask
cnn_channels: 32         # CNN output channels (first layer = cnn_channels // 2) → cnn_out = 32×4×4 = 512
cnn_out_spatial: 4       # AdaptiveMaxPool2d output size
scalar_hidden: 64        # Scalar MLP hidden width
hidden_dim: 256          # Trunk hidden layer width (both layers)
rnn_hidden_dim: 64       # Vanilla RNN hidden state — small enough to visualise all units
action_dim: 5            # up, down, right, left, forage

training:

  # ── Data pipeline ──
  dataset:
    train_path: "data/train_seed42_n128.pt"
    val_path: "data/val_seed42_n16.pt"
    test_path: "data/test_seed42_n16.pt"
    curriculum_switch_steps: 6_000_000
    curriculum_switch_steps_2: 16_000_000
    curriculum_extra_easy_radius: 25
    curriculum_easy_radius: 50

  # ── Rollout collection ──
  parallel_envs: 320
  moves_per_rollout: 256
  total_env_moves: 80_000_000

  # ── Recurrent PPO ──
  seq_len: 16             # Sequence chunk length for truncated BPTT
  epochs_per_update: 4
  minibatch_envs: 64      # Number of envs per minibatch (chunks processed per env)
  learning_rate: 5e-4
  anneal_lr: true

  # ── GAE ──
  discount_factor: 0.999
  gae_lambda: 0.95

  # ── Loss coefficients ──
  policy_clip_range: 0.2
  value_loss_weight: 0.5
  entropy_bonus_weight: 0.01
  max_grad_norm: 0.5

  # ── Evaluation & checkpointing ──
  eval_every_n_updates: 100
  eval_episodes: 16
  checkpoint_every_n_updates: 0
