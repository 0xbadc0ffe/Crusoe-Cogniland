# PICK A — peak-efficiency PPO-GRU agent.
# Shortest, most reliable paths (sweep e0mkqeye: best rollout/episode_length at
# success=1.0; trajectory-eval reach 100% with the 1000-step budget).
# Defining levers: low entropy + strong reward shaping → fast, near-deterministic.
# Standard PPO defaults kept where the sweep was insensitive.
#
# Run:  python scripts/train_ppo_gru.py --config configs/efficient.yaml
#       (any extra CLI flag, e.g. --seed 1, overrides this file)
run_name: ppo_efficient
env_size: 64
map_type: random
max_steps: 1000              # full episode budget
total_timesteps: 3000000

num_envs: 16
num_steps: 128
num_minibatches: 4
update_epochs: 2
learning_rate: 0.0005
anneal_lr: true
gamma: 0.99
gae_lambda: 0.95  
clip_coef: 0.2

ent_coef: 0.01              # low entropy  → efficiency
shaping_coef: 0.02          # strong PBRS  → fast convergence
slack_penalty: -0.01
vf_coef: 0.5
belief_coef: 0.3

device: cuda
wandb_project: crafter_in_cogniland
wandb_mode: online
