defaults:
  - env: default
  - models: ppo
  - _self_

# Global device setting — "auto" picks CUDA if available
device: auto

# Resume training from a checkpoint path (null = start fresh)
resume: null

# ── Training pipeline ──
training:
  map_pool_size: 16
  dataset:
    path: "data/maps_seed42_train128_val16_test16.pt"
    curriculum_switch_steps: 1_000_000   # 0 = disabled; switch EASY → NORMAL at this global_step
    curriculum_easy_radius: 40           # radius (cells) around map center for EASY spawn/target

# Logging
logging:
  wandb:
    project: "cogniland"
    entity: crusoe
    mode: "online"    # "online", "offline", or "disabled"
    store_last_ckpt: false
  trajectory:
    max_saved_per_eval: 3
  eval:
    hp_danger_threshold: 50.0
    deterministic_episodes: 16
    stochastic_episodes: 16
    eval_seed_offset: 1000

# Hydra output directory
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
