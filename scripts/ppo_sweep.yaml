# W&B sweep for PPO-GRU on crafter_in_cogniland (the new natural maps).
#
# Goal: a high-performing, resilient agent with a diverse stochastic policy.
#   * resilient  → map-type=random (trains across lake/rocky/balanced biomes)
#   * diverse    → entropy coefficient swept over a wide range
#   * performing → optimise success/rolling100
# Also sweeps the reward shaping (slack penalty + PBRS coef) and the core PPO
# hyperparameters. num-envs / num-minibatches are fixed so num_envs % nmb == 0.
program: scripts/train_ppo_gru.py
project: crafter_in_cogniland     # must match the trainer's wandb.init project
entity: crusoe
method: bayes
metric:
  name: success/rolling100
  goal: maximize
command:
  - /home/filippo/miniconda3/envs/crusoe/bin/python
  - ${program}
  - --env-size=64
  - --num-envs=16
  - --num-minibatches=4
  - --map-type=random
  - --max-steps=1000
  - --total-timesteps=2000000
  - --device=cuda
  - --anneal-lr
  - --wandb-project=crafter_in_cogniland
  - --wandb-mode=online
  - --checkpoint-dir=checkpoints/sweep
  - ${args}
parameters:
  ent-coef:                       # policy stochasticity / diversity lever
    distribution: log_uniform_values
    min: 0.002
    max: 0.05
  learning-rate:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.0005
  gamma:
    distribution: uniform
    min: 0.985
    max: 0.999
  gae-lambda:
    distribution: uniform
    min: 0.90
    max: 0.97
  num-steps:
    values: [64, 128, 256]
  update-epochs:
    values: [2, 4, 8]
  vf-coef:
    distribution: uniform
    min: 0.3
    max: 1.0
  belief-coef:
    distribution: uniform
    min: 0.1
    max: 1.0
  clip-coef:
    distribution: uniform
    min: 0.10
    max: 0.30
  shaping-coef:                   # PBRS reward shaping strength
    distribution: log_uniform_values
    min: 0.005
    max: 0.02
  slack-penalty:                  # flat per-step reward
    distribution: uniform
    min: -0.04
    max: -0.01
