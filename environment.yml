# Crusoe-Cogniland — conda env for the bridge_tunnel project.
#
#   conda env create -f environment.yml && conda activate crusoe
#
# GPU note: the pinned jax[cuda12] + the default torch wheel target NVIDIA CUDA.
#   * CPU-only: replace `jax[cuda12]` with `jax` and install the CPU torch wheel.
#   * Other CUDA: install the matching torch wheel from https://pytorch.org
#     (e.g. `pip install torch --index-url https://download.pytorch.org/whl/cu121`).
# The standalone steering kit shipped in activation_datasets/ needs only
# numpy + torch + h5py + pandas + matplotlib (no jax).
name: crusoe
channels:
  - conda-forge
dependencies:
  - python>=3.12,<3.13
  - pip
  - pip:
    # --- core / PyTorch (PPO + the policy) ---
    - torch>=2.2
    - numpy>=1.24
    - scipy>=1.11            # mapgen (connected components, distance transform) + cost-to-go
    - gymnasium>=0.29.0
    # --- JAX / DreamerV3 stack (the JAX env + dreamer trainer + parity tests) ---
    - jax[cuda12]>=0.4.34
    - flax>=0.8.0
    - optax>=0.2.0
    - orbax-checkpoint>=0.5.0
    - flashbax>=0.1.0
    - gymnax>=0.0.8
    - chex>=0.1.85
    # --- data / activation datasets ---
    - h5py>=3.9
    - pandas>=2.0
    - pyarrow>=14.0          # parquet engine for labels/decisions
    # --- maps / viz / demo / logging ---
    - opensimplex>=0.4.0
    - matplotlib>=3.7
    - pillow>=10.0.0
    - imageio>=2.30.0
    - imageio-ffmpeg>=0.4.9  # trajectory videos
    - pygame>=2.0.0          # playable demo
    - wandb[workspaces,media]>=0.16.0
    - tqdm
    # --- dev ---
    - pytest>=7.0.0
    - -e .
