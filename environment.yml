name: crusoe
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python>=3.12,<3.13
  - pytorch>=2.0
  - numpy>=1.24
  - matplotlib>=3.7
  - scipy>=1.10.0
  - pip
  - pip:
    - gymnasium>=0.29.0
    - hydra-core>=1.3.0
    - omegaconf>=2.3.0
    - wandb[workspaces,media]>=0.16.0
    - chardet>=3.0.2,<6
    - charset-normalizer>=2.0,<4
    - pygame>=2.0.0
    - pytest>=7.0.0
    - -e .
