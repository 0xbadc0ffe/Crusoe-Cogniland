[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogniland"
version = "0.3.0"
description = "Cogniland Nav — a procedurally-generated navigation env + PPO/Dreamer baselines."
requires-python = ">=3.11"
dependencies = [
    # Core RL agents (PyTorch-only)
    "torch",
    "numpy",
    "einops",
    "wandb",
    "tqdm",
    "tabulate",
    "imageio",
    "imageio-ffmpeg",
    # Cogniland Nav env
    "gymnasium",
    "pygame",
    "pillow",
    "opensimplex",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cogniland.assets" = ["sprites/*.png", "README.md"]
