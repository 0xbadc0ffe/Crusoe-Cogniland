[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogniland"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "jax[cuda12]",
    "flax",
    "optax",
    "orbax-checkpoint",
    "chex",
    "omegaconf",
    "wandb",
    "tqdm",
    "tabulate",
    "numpy",
    "torch",
    "einops",
    "distrax",
]

[tool.setuptools.packages.find]
where = ["src"]
