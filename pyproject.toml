[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogniland"
version = "0.4.0"
description = "crafter_in_cogniland — pure-JAX navigation env + Dreamer/PPO baselines."
requires-python = ">=3.11"
dependencies = [
    # JAX stack (Dreamer trainer + crafter_in_cogniland env)
    "jax>=0.8.0",
    "jax[cuda12]>=0.8.0; sys_platform == 'linux'",
    "flax>=0.12.0",
    "optax>=0.2.5",
    "chex>=0.1.90",
    "flashbax>=0.1.3",
    "orbax-checkpoint>=0.11.0",
    "gymnax>=0.0.7",
    # PyTorch stack (PPO + GRU trainer, pygame demo)
    "torch>=2.0",
    "einops",
    # Cogniland Nav env (PyTorch) — kept for PPO + demo
    "gymnasium",
    "pygame",
    "pillow",
    "opensimplex",
    # IO + logging + viz
    "wandb",
    "tqdm",
    "tabulate",
    "matplotlib",
    "imageio",
    "imageio-ffmpeg",
    "numpy",
    "omegaconf",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["cogniland*", "purejaxwm*"]

[tool.setuptools.package-data]
"cogniland.assets" = ["sprites/*.png", "README.md"]
