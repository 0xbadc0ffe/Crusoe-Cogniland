[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogniland"
version = "0.4.0"
description = "bridge_tunnel — POMDP navigation env (PyTorch + pure-JAX) with PPO + DreamerV3 baselines."
requires-python = ">=3.12"
# Single source of truth for dependencies. Install with:
#   python -m venv .venv && source .venv/bin/activate
#   pip install -e .          # runtime
#   pip install -e .[dev]     # + test deps
#
# GPU note: jax[cuda12] (linux) and the default torch wheel target NVIDIA CUDA 12+.
#   * CPU only: `pip install -e .` then reinstall the CPU torch/jax wheels.
#   * Other CUDA: install the matching torch wheel from https://pytorch.org first.
# The standalone steering kit in activation_datasets/ needs only
# numpy + torch + h5py + pandas + matplotlib (no jax).
dependencies = [
    # JAX stack (DreamerV3 trainer + the pure-JAX bridge_tunnel env + parity tests)
    "jax>=0.8.0",
    "jax[cuda12]>=0.8.0; sys_platform == 'linux'",
    "flax>=0.12.0",
    "optax>=0.2.5",
    "chex>=0.1.90",
    "flashbax>=0.1.3",
    "orbax-checkpoint>=0.11.0",
    "gymnax>=0.0.7",
    # PyTorch stack (PPO + GRU policy, pygame demo)
    "torch>=2.2",
    "numpy>=1.24",
    "scipy>=1.11",            # mapgen (connected components / distance transform) + cost-to-go
    "gymnasium>=0.29.0",
    "pygame>=2.0.0",
    "pillow>=10.0.0",
    "opensimplex>=0.4.0",
    # Activation datasets (mech-interp bundles)
    "h5py>=3.9",
    "pandas>=2.0",
    "pyarrow>=14.0",          # parquet engine for labels/decisions
    # IO + logging + viz
    "wandb>=0.16.0",
    "tqdm",
    "matplotlib>=3.7",
    "imageio>=2.30.0",
    "imageio-ffmpeg>=0.4.9",  # trajectory videos
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
# mech-interp activation-geometry analysis pipeline (scripts/mechinterp/analysis/)
analysis = [
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "plotly>=5.18",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["cogniland*", "purejaxwm*"]

[tool.setuptools.package-data]
"cogniland.assets" = ["sprites/*.png", "README.md"]
