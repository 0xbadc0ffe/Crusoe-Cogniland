[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cogniland-jax"
version = "0.1.0"
description = "Pure-JAX Gymnax-style Cogniland environment — 128x128 survival-navigation with berries, drain terrain, and crafted tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cogniland contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "flax>=0.8",
    "gymnax>=0.0.9",
    "numpy>=1.24",
    # torch is used only by maps.py to load legacy .pt datasets — swap
    # to `safetensors` or `numpy.load` if you regenerate the dataset.
    "torch>=2.0",
]

[project.optional-dependencies]
demo = ["pygame-ce>=2.5"]
dev = [
    "pytest>=7",
    "ruff>=0.1",
]

[project.urls]
Source = "https://github.com/your-org/cogniland-jax"

[tool.setuptools.packages.find]
include = ["cogniland_jax*"]

[tool.setuptools.package-data]
cogniland_jax = ["py.typed"]
