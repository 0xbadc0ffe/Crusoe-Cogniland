# PPO Configuration for RGB observations (CleanBA defaults)
# Uses IMPALA-CNN architecture with CleanBA-proven hyperparameters
# Reference: https://github.com/vwxyzjn/cleanba

agent:
  name: ppo
  type: ppo

  # Learning (Adam optimizer with CleanBA settings)
  lr: 2.5e-4  # CleanBA default for Atari
  anneal_lr: true  # Linear annealing throughout training

  # PPO hyperparameters (CleanBA defaults)
  num_steps: 128  # Rollout length
  gamma: 0.99  # Discount factor
  gae_lambda: 0.95  # GAE lambda
  clip_eps: 0.1  # PPO clipping coefficient
  entropy_coef: 0.01  # Entropy bonus
  value_coef: 0.5  # Value loss coefficient
  clip_grad: 0.5  # Max gradient norm
  normalize_advantages: true  # Normalize advantages per minibatch

  # Update settings (CleanBA defaults)
  ppo_epochs: 4  # Number of PPO epochs per update
  num_minibatches: 4  # Number of minibatches per epoch

  # Network architecture (IMPALA-CNN + single-layer heads)
  hidden_size: 256  # IMPALA-CNN output dimension
  head_num_layers: 1  # Single-layer actor/critic heads (CleanBA style)
  activation: relu  # ReLU activation

  # RNN settings (optional recurrent backbone)
  use_rnn: false  # Enable LSTM backbone between encoder and heads
  lstm_size: 256  # LSTM hidden size (only used if use_rnn=true)

  # Checkpoint settings
  checkpoint:
    enabled: true                    # Enable checkpoint saving
    interval: 1000                   # Save checkpoint every N training steps
    keep_last: 3                     # Keep last N checkpoints (0 = keep all)
    save_best: true                  # Save best checkpoint based on eval performance
    checkpoint_dir: checkpoints      # Directory for checkpoints (relative to results/{run_id}/)

# Environment settings
# Use RGB first-person observations for IMPALA-CNN
env:
  navix_observation_type: rgb_first_person  # (56, 56, 3) RGB observations

metrics_tracker:
  baselines_path: configs/baselines/ppo_minigrid.yaml