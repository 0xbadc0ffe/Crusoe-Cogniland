[project]
name = "cl"
version = "0.2.0"  # Bump for JAX migration
description = "Continually Learning Agents"
authors = [
    {name = "Joonsu Gha", email = "joogha@ethz.ch"},
    {name = "Konrad Szafer", email = "kszafer@ethz.ch"}
]
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    # JAX stack (upgraded for RTX 5090 Blackwell sm_120 support)
    # Note: JAX 0.7.1+ fixes "Unsupported conversion" errors on RTX 5090
    "jax[cuda12] >= 0.7.1",  # Min version for Flax and RTX 5090 support
    "jaxlib >= 0.7.1",  # Match JAX version
    "nvidia-cuda-nvcc-cu12 >= 12.8.93",  # CUDA 12.8+ required for RTX 5090 (Blackwell sm_120)
    "flax >= 0.10.2",  # Compatible with JAX >= 0.7.1
    "optax >= 0.2.4",  # Compatible with JAX >= 0.5.3
    "chex >= 0.1.87",  # Compatible with JAX >= 0.7.0
    "rlax >= 0.1.6",  # Compatible with JAX >= 0.7.0
    "distrax >= 0.1.7",  # Compatible with JAX >= 0.7.0

    # Environments (JAX-native)
    "craftax >= 1.5.0",
    "ale-py >= 0.8.1",  # Atari Learning Environment (for DreamerV3)
    # Note: EnvPool removed due to JAX compatibility issues, will fork and fix separately

    # Utilities
    "omegaconf >= 2.3.0",
    "numpy >= 1.25, <3.0.0",
    "wandb[media] >= 0.19.6, <0.20.0",
    "pillow >= 11.1.0, <12.0.0",
    "tabulate >= 0.9.0, <0.10.0",
    "imageio >= 2.37.0, <3.0.0",
    "python-dotenv >= 1.0.1, <2.0.0",
    "einops >= 0.8.1, <0.9.0",
    "matplotlib >= 3.10.6, <4.0.0",
    "tqdm >= 4.67.1, <5.0.0",
    "opencv-python >= 4.11.0.86, <5.0.0.0",

    # Dev tools
    "ruff >= 0.11.5, <0.12.0",
    "pre-commit >= 4.2.0, <5.0.0",
]

[project.optional-dependencies]
jupyter = ["ipykernel >= 6.30.1, <7.0.0"]
dev = ["nvitop >= 1.5.1, <2.0.0"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "cl"
version = "0.2.0"

[tool.poetry.dependencies]
python = ">=3.11,<=3.13"
navix = {path = "cl/environments/navix_lib", develop = true}

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

target-version = "py311"

[tool.ruff.lint]
select = ["I"]
ignore-init-module-imports = false

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"cl/trainer/utils.py" = ["F821"]

[tool.ruff.format]
# Always normalize line endings to LF
line-ending = "lf"
